<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <title>Марафон питания</title>

  <!-- Мета для мобильных -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101010" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA настройки -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Питание" />
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --green-1: #b4f24c;
      /* салатный */
      --green-2: #3bd45b;
      /* зелёный */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      background: #111;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.35) 40%, rgba(0, 0, 0, 0.15) 100%);
      pointer-events: none;
    }

    /* Заголовок: две строки, крупнее, с выраженной тенью */
    .title {
      position: absolute;
      left: 50%;
      top: calc(45% - 5vh);
      transform: translate(-50%, -50%);
      width: 90vw;
      text-align: center;
      z-index: 2;
      margin: 0;
      line-height: 1.1;
      letter-spacing: 0.02em;
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(28px, 8.2vw, 40px);
      text-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        0 4px 14px rgba(0, 0, 0, 0.35),
        0 1px 0 rgba(0, 0, 0, 0.6);
    }

    .title span {
      display: block;
    }

    .cta {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + var(--safe-bottom));
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(86vw, 420px);
      min-height: 56px;
      padding: 14px 22px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(90deg, var(--green-1) 0%, var(--green-2) 100%);
      box-shadow: 0 12px 28px rgba(59, 212, 91, 0.28), 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.08s ease-out, filter 0.15s ease, box-shadow 0.2s ease;
      will-change: transform, filter;
      -webkit-user-select: none;
      user-select: none;
      font-size: 16px;
    }

    .cta:active {
      transform: translateX(-50%) scale(0.98);
      filter: brightness(0.98);
      box-shadow: 0 8px 20px rgba(59, 212, 91, 0.23), 0 2px 8px rgba(0, 0, 0, 0.22);
    }

    @media (orientation: landscape) {
      .title {
        top: 45%;
        font-size: clamp(24px, 6vw, 34px);
      }

      .cta {
        min-height: 52px;
      }
    }

    /* ===== Install Banner ===== */
    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
      color: #fff;
      padding: 1rem 1rem 1.2rem;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .install-banner.show {
      display: flex;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .install-banner-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      max-width: 400px;
    }

    .install-banner-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .install-banner-text {
      flex: 1;
    }

    .install-banner-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 0.15rem;
    }

    .install-banner-subtitle {
      font-size: 0.8rem;
      opacity: 0.85;
      margin: 0;
      line-height: 1.3;
    }

    .install-banner-close {
      position: absolute;
      top: 0.5rem;
      right: 0.7rem;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.2rem;
      line-height: 1;
    }

    .install-banner-btn {
      display: inline-block;
      padding: 0.65rem 1.8rem;
      background: #b4f24c;
      color: #1a1a1a;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .install-banner-steps {
      font-size: 0.8rem;
      opacity: 0.9;
      text-align: center;
      line-height: 1.5;
      max-width: 340px;
    }

    .install-banner-steps b {
      color: #b4f24c;
    }
  </style>
</head>

<body>

  <div class="screen">
    <!-- Замените src на своё вертикальное изображение 9:16 -->
    <img src="background.png" alt="Фон" class="bg" />
    <div class="overlay"></div>

    <!-- Две строки: Марафон / Питания -->
    <h1 class="title">
      <span>Марафон</span>
      <span>Питания</span>
    </h1>

    <a class="cta" href="main.html" aria-label="Начать марафон">Начать</a>
  </div>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <button class="install-banner-close" id="installClose" aria-label="Закрыть">&times;</button>
    <div class="install-banner-header">
      <img src="icon-192.png" alt="Icon" class="install-banner-icon">
      <div class="install-banner-text">
        <p class="install-banner-title" id="installTitle">Установите приложение</p>
        <p class="install-banner-subtitle" id="installSubtitle">Быстрый доступ с экрана "Домой"</p>
      </div>
    </div>
    <button class="install-banner-btn" id="installBtn">Установить</button>
    <div class="install-banner-steps" id="installSteps"></div>
  </div>

  <script>
    // На мобильных иногда помогает сброс позиции скролла при повторном открытии
    window.addEventListener('load', () => { window.scrollTo(0, 0); });

    // 1. Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }

    // 2. Логика баннера установки
    (function () {
      const banner = document.getElementById('installBanner');
      const btn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('installClose');
      const stepsEl = document.getElementById('installSteps');
      const titleEl = document.getElementById('installTitle');
      const subtitleEl = document.getElementById('installSubtitle');

      // Если уже установлено как приложение — выходим
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;

      // === Определение платформы ===
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);

      // === Определение WebView (Telegram, Instagram, VK, Facebook) ===
      const isTelegram = /Telegram/i.test(ua);
      const isInstagram = /Instagram/i.test(ua);
      const isFacebook = /FBAN|FBAV/i.test(ua);
      const isVK = /VKAndroidApp|vk_app/i.test(ua);
      const isWebView = isTelegram || isInstagram || isFacebook || isVK || /\bwv\b/.test(ua);

      // === Определение браузера ===
      const isChrome = /Chrome/i.test(ua) && !/OPR|Opera|Edge|Edg|Samsung|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
      const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|FxiOS|OPiOS|mercury|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
      const isOpera = /OPR|Opera/i.test(ua);
      const isFirefox = /Firefox|FxiOS/i.test(ua);
      const isSamsung = /SamsungBrowser/i.test(ua);
      const isEdge = /Edg|Edge/i.test(ua);
      const isYandex = /YaBrowser/i.test(ua);
      const isUC = /UCBrowser/i.test(ua);

      let deferredPrompt = null;
      let bannerShown = false;

      // === Перехват события установки для Chrome ===
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showBanner('native');
      });

      // === Для iOS и WebView — показываем баннер СРАЗУ ===
      if (isWebView) {
        showBanner('webview');
      } else if (isIOS && isSafari) {
        showBanner('ios-safari');
      } else if (isIOS && !isSafari) {
        showBanner('ios-other');
      }

      // === Для Chrome/Android/Desktop — ждём 500мс на beforeinstallprompt ===
      if (!bannerShown) {
        setTimeout(() => {
          if (bannerShown) return;
          if (isAndroid && !deferredPrompt) {
            showBanner('android-other');
          } else if (!isAndroid && !isIOS && !deferredPrompt) {
            showBanner('desktop-other');
          }
        }, 500);
      }

      // === Название текущего браузера ===
      function getBrowserName() {
        if (isTelegram) return 'Telegram';
        if (isInstagram) return 'Instagram';
        if (isFacebook) return 'Facebook';
        if (isVK) return 'ВКонтакте';
        if (isOpera) return 'Opera';
        if (isFirefox) return 'Firefox';
        if (isSamsung) return 'Samsung Internet';
        if (isEdge) return 'Edge';
        if (isYandex) return 'Яндекс Браузер';
        if (isUC) return 'UC Browser';
        return 'этот браузер';
      }

      // === Открыть в Chrome через Android Intent ===
      function openInChrome() {
        const currentUrl = window.location.href;
        const url = new URL(currentUrl);
        const intentUrl = 'intent://' + url.host + url.pathname + url.search + url.hash +
          '#Intent;scheme=https;package=com.android.chrome;end';
        window.location.href = intentUrl;
      }

      // === Открыть в Safari через URL scheme (iOS) ===
      function openInSafari() {
        const currentUrl = window.location.href;
        const safariUrl = currentUrl
          .replace(/^https:\/\//, 'x-safari-https://')
          .replace(/^http:\/\//, 'x-safari-http://');
        window.location.href = safariUrl;
      }

      // === Скопировать ссылку (фоллбэк для десктопа) ===
      function copyLink(button) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          button.textContent = '✓ Ссылка скопирована!';
          setTimeout(() => { button.textContent = button.dataset.originalText || 'Скопировать ссылку'; }, 2500);
        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = window.location.href;
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          button.textContent = '✓ Ссылка скопирована!';
          setTimeout(() => { button.textContent = button.dataset.originalText || 'Скопировать ссылку'; }, 2500);
        });
      }

      // === Показать баннер ===
      function showBanner(mode) {
        if (bannerShown) return;
        bannerShown = true;
        banner.classList.add('show');

        if (mode === 'native') {
          // ✅ Chrome: нативная установка
          titleEl.textContent = 'Установите приложение';
          subtitleEl.textContent = 'Быстрый доступ с экрана "Домой"';
          btn.textContent = 'Установить';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = '';
          btn.onclick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') {
                banner.classList.remove('show');
              }
              deferredPrompt = null;
            }
          };

        } else if (mode === 'ios-safari') {
          // 📱 iOS Safari: инструкция
          titleEl.textContent = 'Добавьте на главный экран';
          subtitleEl.textContent = 'Для быстрого доступа как приложение';
          btn.style.display = 'none';
          stepsEl.innerHTML = 'Нажмите <b>Поделиться</b> ' +
            '<img src="https://ic.willsentance.com/share-ios.svg" style="height:1.1em;vertical-align:middle"> внизу экрана,<br>' +
            'затем <b>«На экран «Домой»»</b>';

        } else if (mode === 'ios-other') {
          // 📱 iOS, не Safari → перенаправить в Safari
          const browserName = getBrowserName();
          titleEl.textContent = 'Откройте в Safari';
          subtitleEl.textContent = browserName + ' не поддерживает установку';
          btn.textContent = 'Открыть в Safari';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = 'В Safari нажмите <b>Поделиться</b> → <b>«На экран Домой»</b>';
          btn.onclick = () => {
            navigator.clipboard.writeText(window.location.href).catch(() => { });
            openInSafari();
          };

        } else if (mode === 'android-other') {
          // 🤖 Android, не Chrome → перенаправить в Chrome
          const browserName = getBrowserName();
          titleEl.textContent = 'Откройте в Chrome';
          subtitleEl.textContent = browserName + ' не поддерживает установку';
          btn.textContent = 'Открыть в Chrome';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
          btn.onclick = () => { openInChrome(); };

        } else if (mode === 'webview') {
          // 💬 Telegram / Instagram / VK / Facebook
          const browserName = getBrowserName();
          if (isAndroid) {
            titleEl.textContent = 'Откройте в Chrome';
            subtitleEl.textContent = 'Установка из ' + browserName + ' невозможна';
            btn.textContent = 'Открыть в Chrome';
            btn.style.display = 'inline-block';
            stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
            btn.onclick = () => { openInChrome(); };
          } else if (isIOS) {
            titleEl.textContent = 'Откройте в Safari';
            subtitleEl.textContent = 'Установка из ' + browserName + ' невозможна';
            btn.textContent = 'Открыть в Safari';
            btn.style.display = 'inline-block';
            stepsEl.innerHTML = 'В Safari нажмите <b>Поделиться</b> → <b>«На экран Домой»</b>';
            btn.onclick = () => {
              navigator.clipboard.writeText(window.location.href).catch(() => { });
              openInSafari();
            };
          } else {
            titleEl.textContent = 'Откройте в Chrome';
            subtitleEl.textContent = 'Для установки приложения';
            btn.textContent = 'Скопировать ссылку';
            btn.dataset.originalText = 'Скопировать ссылку';
            btn.style.display = 'inline-block';
            stepsEl.innerHTML = 'Откройте <b>Google Chrome</b> и вставьте ссылку';
            btn.onclick = () => { copyLink(btn); };
          }

        } else if (mode === 'desktop-other') {
          // 🖥️ Десктоп (Firefox, Edge, Opera и т.д.)
          titleEl.textContent = 'Откройте в Chrome';
          subtitleEl.textContent = 'Для установки приложения';
          btn.textContent = 'Скопировать ссылку';
          btn.dataset.originalText = 'Скопировать ссылку';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = 'Откройте <b>Google Chrome</b> и вставьте ссылку.<br>Появится кнопка <b>«Установить»</b> в адресной строке.';
          btn.onclick = () => { copyLink(btn); };
        }
      }

      // === Закрытие баннера ===
      closeBtn.addEventListener('click', () => {
        banner.classList.remove('show');
      });
    })();
  </script>
</body>

</html>
