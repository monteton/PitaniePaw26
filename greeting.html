<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Приветствие</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #dcdcdc; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: #000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Используем contain, чтобы видео не обрезалось, фон все равно черный */
        }
        .close-button {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top, 0px));
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            z-index: 10;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: background-color 0.3s;
        }
        .close-button:hover, .close-button:active {
            background-color: rgba(255, 255, 255, 0.4);
        }
    </style>
    <script src="access-control.js"></script>
</head>
<body>
    <div class="mobile-frame">
        <a href="main.html" class="close-button">
            <i class="fa-solid fa-xmark"></i>
        </a>
        <div class="video-container">
            <video controls controlsList="nodownload" preload="metadata" playsinline autoplay>
                <source src="https://file-storage.bothelp.io/myuppy/c8/c8aa/c8aa6ce1c5e23e77a85a9bba1951ad49/%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5%20%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
        </div>
    </div>
</body>
</html>
